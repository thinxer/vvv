[package]
name = "vvv"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
resolver = "3"
members = ["crates/apple", "crates/combined", "crates/apple-screen-sharing", "crates/nvenc", "crates/session", "crates/ironrdp", "crates/wayland-capture", "crates/cuda-scanout"]
exclude = [".cache", ".local", "crosvm"]

[profile.dev.package.yuv]
opt-level = 3

[profile.dev.package.ironrdp-graphics]
opt-level = 3

[profile.dev.package.ironrdp-pdu]
opt-level = 2
