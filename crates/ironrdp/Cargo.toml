[package]
name = "vvv-rdp"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib","rlib"]

[dependencies]
vvv-session = { path = "../session" }
vvv-nvenc-driver = { path = "../nvenc-driver" }
yuv = "0.8.20"
anyhow = "1"
async-trait = "0.1"
bytes = "1"
ironrdp-server = { git = "https://github.com/Devolutions/IronRDP", rev = "e0727394c0c5ef172a13617594e1b2db90e006f7", default-features = false, features = ["egfx"] }
ironrdp-displaycontrol = { git = "https://github.com/Devolutions/IronRDP", rev = "e0727394c0c5ef172a13617594e1b2db90e006f7" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-rustls = {version = "0.26", default-features = false, features=["ring","tls12"]}
rcgen = "0.14"
ironrdp-egfx = { git = "https://github.com/Devolutions/IronRDP", rev = "e0727394c0c5ef172a13617594e1b2db90e006f7" }
ironrdp-dvc = { git = "https://github.com/Devolutions/IronRDP", rev = "e0727394c0c5ef172a13617594e1b2db90e006f7" }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "e0727394c0c5ef172a13617594e1b2db90e006f7" }
ironrdp-svc = { git = "https://github.com/Devolutions/IronRDP", rev = "e0727394c0c5ef172a13617594e1b2db90e006f7" }
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP", rev = "e0727394c0c5ef172a13617594e1b2db90e006f7" }
ironrdp-graphics = { git = "https://github.com/Devolutions/IronRDP", rev = "e0727394c0c5ef172a13617594e1b2db90e006f7" }

[dependencies.cuda-scanout]
path = "../cuda-scanout"
