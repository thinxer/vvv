[package]
name = "vvv-remote"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "vvv-combined"
path = "src/main.rs"
required-features = ["combined"]

[features]
default = ["combined"]
combined = ["dep:vvv-rdp", "dep:vvv-session", "dep:bytes"]

[dependencies]
vvv-apple = { path = "../apple" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "macros", "time", "net", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde_json = "1"
socket2 = "0.6"
apple-screen-sharing = { path = "../apple-screen-sharing" }
vvv-nvenc = { path = "../nvenc" }
vvv-rdp = { path = "../ironrdp", optional = true }
vvv-session = { path = "../session", optional = true }
bytes = { version = "1", optional = true }
cuda-scanout = { path = "../cuda-scanout" }
wayland-capture = { path = "../wayland-capture" }
libc = "0.2"
tracing = "0.1"
